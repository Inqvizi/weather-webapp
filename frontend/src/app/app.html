<div class="min-h-screen w-full bg-[#0b131e]">
<div class="max-w-[1400px] mx-auto p-4 lg:p-6 pb-24 lg:pb-6 flex flex-col lg:flex-row gap-6 min-h-screen">

  <app-sidebar></app-sidebar>

  <div class="flex-1 flex flex-col gap-6 w-full max-w-[100vw]">
    <app-search-bar (search)="searchCity($event)"></app-search-bar>

    @if (errorMessage()) {
      <div class="text-red-500 text-xl font-bold bg-red-500/10 p-6 rounded-3xl border border-red-500 text-center flex items-center justify-center h-48 motion-safe:animate-fade-in">
        <i class="bi bi-exclamation-triangle-fill mr-3 text-3xl"></i>
        {{ errorMessage() }}
      </div>
    } @else if (currentWeather() && forecast()) {
      <div class="flex flex-col gap-6 motion-safe:animate-slide-up">
        <div class="px-2 pt-2 lg:pt-4 pb-2">
          <app-current-weather [weather]="currentWeather()!"></app-current-weather>
        </div>

        <div class="bg-[#202b3b] rounded-3xl p-4 lg:p-6 shadow-inner border border-gray-700">
          <app-hourly-forecast [forecast]="forecast()!" [selectedDate]="selectedDate()"></app-hourly-forecast>
        </div>

        <div class="bg-[#202b3b] rounded-3xl p-4 lg:p-6 shadow-inner border border-gray-700">
          <app-air-conditions [weather]="currentWeather()!"></app-air-conditions>
        </div>
      </div>
    } @else {
      <div class="flex flex-col gap-6 motion-safe:animate-fade-in">
        <div class="h-48 rounded-3xl bg-[#202b3b]/50 animate-pulse border border-gray-700/50"></div>
        <div class="h-48 rounded-3xl bg-[#202b3b]/50 animate-pulse border border-gray-700/50"></div>
        <div class="h-48 rounded-3xl bg-[#202b3b]/50 animate-pulse border border-gray-700/50"></div>
      </div>
    }
  </div>

  <div class="w-full lg:w-[400px] lg:min-w-[400px] shrink-0 bg-[#202b3b] rounded-3xl p-4 lg:p-6 shadow-inner border border-gray-700 h-fit mb-24 lg:mb-0">
    @if (forecast() && !errorMessage()) {
      <div class="motion-safe:animate-slide-up">
        <app-seven-day-forecast [forecast]="forecast()!" [selectedDate]="selectedDate()" (daySelected)="selectedDate.set($event)"></app-seven-day-forecast>
      </div>
    } @else {
      <div class="h-96 rounded-2xl bg-gray-700/20 animate-pulse motion-safe:animate-fade-in"></div>
    }
  </div>
</div>
</div>

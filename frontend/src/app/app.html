<div class="min-h-screen w-full bg-[#0b131e] overflow-x-hidden">
  <div class="max-w-[1440px] mx-auto p-3 sm:p-4 md:p-6 pb-24 lg:pb-6 flex flex-col lg:flex-row gap-4 lg:gap-6 min-h-screen">

    <!-- Sidebar with responsive positioning (bottom bar on mobile/tablet, vertical sidebar on desktop) -->
    <app-sidebar [activeTab]="activeTab()" (tabChange)="onTabChange($event)"></app-sidebar>

    <!-- Main Content Area: min-w-0 prevents child overflow from breaking flex container -->
    @if (activeTab() === 'weather') {
      <div class="flex-1 min-w-0 flex flex-col gap-4 lg:gap-6">
        <app-search-bar
          (search)="searchCity($event)"
          (coordinatesSelected)="searchByCoordinates($event)"
        ></app-search-bar>



        @if (errorMessage()) {
          <div class="text-red-400 text-lg sm:text-xl font-bold bg-red-500/10 p-6 rounded-3xl border border-red-500/30 text-center flex items-center justify-center min-h-[12rem] motion-safe:animate-fade-in">
            <i class="bi bi-exclamation-triangle-fill mr-3 text-2xl sm:text-3xl text-red-500"></i>
            {{ errorMessage() }}
          </div>
        } @else if (currentWeather() && forecast()) {
          <div class="flex flex-col gap-4 lg:gap-6 motion-safe:animate-slide-up min-w-0">
            <!-- Current Weather Card -->
            <div class="px-1 sm:px-2 pt-1 lg:pt-2">
              <app-current-weather [weather]="currentWeather()!"></app-current-weather>
            </div>

            <!-- Hourly Forecast Card -->
            <div class="bg-[#202b3b] rounded-3xl p-4 sm:p-6 shadow-inner border border-gray-700 min-w-0 overflow-hidden">
              <app-hourly-forecast
                [forecast]="forecast()!"
                [selectedDate]="selectedDate()"
                (clearSelectedDate)="selectedDate.set(null)"
              ></app-hourly-forecast>
            </div>

            <!-- Air Conditions Card -->
            <div class="bg-[#202b3b] rounded-3xl p-4 sm:p-6 shadow-inner border border-gray-700">
              <app-air-conditions [weather]="currentWeather()!"></app-air-conditions>
            </div>
          </div>
        } @else {
          <!-- Skeleton Loading State -->
          <div class="flex flex-col gap-4 lg:gap-6 motion-safe:animate-fade-in">
            <div class="h-40 rounded-3xl bg-[#202b3b]/50 animate-pulse border border-gray-700/50"></div>
            <div class="h-44 rounded-3xl bg-[#202b3b]/50 animate-pulse border border-gray-700/50"></div>
            <div class="h-48 rounded-3xl bg-[#202b3b]/50 animate-pulse border border-gray-700/50"></div>
          </div>
        }
      </div>

      <!-- Right Column: 7-Day Forecast (stacks below on <lg, sits to the right on >=lg) -->
      <div class="w-full lg:w-[330px] xl:w-[380px] shrink-0 bg-[#202b3b] rounded-3xl p-4 sm:p-6 shadow-inner border border-gray-700 h-fit mb-6 lg:mb-0">
        @if (forecast() && !errorMessage()) {
          <div class="motion-safe:animate-slide-up">
            <app-seven-day-forecast
              [forecast]="forecast()!"
              [selectedDate]="selectedDate()"
              (daySelected)="selectedDate.set($event)"
            ></app-seven-day-forecast>
          </div>
        } @else {
          <div class="h-96 rounded-2xl bg-gray-700/20 animate-pulse motion-safe:animate-fade-in"></div>
        }
      </div>
    } @else if (activeTab() === 'cities') {
      <div class="flex-1 min-w-0 w-full motion-safe:animate-fade-in">
        <app-cities (selectCity)="onCityFromList($event)"></app-cities>
      </div>
    } @else if (activeTab() === 'settings') {
      <div class="flex-1 min-w-0 w-full motion-safe:animate-fade-in">
        <app-settings></app-settings>
      </div>
    }

  </div>
</div>

<div class="flex justify-between items-center mb-4 sm:mb-6">
  <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Air Conditions</h3>
</div>
<div class="grid grid-cols-2 sm:grid-cols-4 gap-4 sm:gap-6">
  <div class="flex items-start gap-2.5 sm:gap-3">
    <i class="bi bi-thermometer-half text-gray-400 text-lg sm:text-xl mt-0.5"></i>
    <div class="flex flex-col">
      <span class="text-gray-400 text-xs sm:text-sm mb-0.5">Real Feel</span>
      <span class="text-xl sm:text-2xl lg:text-3xl font-bold text-white">{{ formatFeelsLike() }}&deg;</span>
    </div>
  </div>
  <div class="flex items-start gap-2.5 sm:gap-3">
    <i class="bi bi-wind text-gray-400 text-lg sm:text-xl mt-0.5"></i>
    <div class="flex flex-col">
      <span class="text-gray-400 text-xs sm:text-sm mb-0.5">Wind</span>
      <span class="text-xl sm:text-2xl lg:text-3xl font-bold text-white">{{ formatWind() }}</span>
    </div>
  </div>
  <div class="flex items-start gap-2.5 sm:gap-3">
    <i class="bi bi-droplet-fill text-gray-400 text-lg sm:text-xl mt-0.5"></i>
    <div class="flex flex-col">
      <span class="text-gray-400 text-xs sm:text-sm mb-0.5">Humidity</span>
      <span class="text-xl sm:text-2xl lg:text-3xl font-bold text-white">{{ weather.humidity }}%</span>
    </div>
  </div>
  <div class="flex items-start gap-2.5 sm:gap-3">
    <i class="bi bi-speedometer2 text-gray-400 text-lg sm:text-xl mt-0.5"></i>
    <div class="flex flex-col">
      <span class="text-gray-400 text-xs sm:text-sm mb-0.5">Pressure</span>
      <span class="text-xl sm:text-2xl lg:text-3xl font-bold text-white">{{ formatPressure() }}</span>
    </div>
  </div>
</div>

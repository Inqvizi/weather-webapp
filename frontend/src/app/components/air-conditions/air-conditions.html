<div class="flex justify-between items-center mb-6">
  <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Air Conditions</h3>
</div>
<div class="grid grid-cols-2 gap-y-8 gap-x-4">
  <div class="flex items-start gap-3">
    <i class="bi bi-thermometer-half text-gray-400 text-xl mt-1"></i>
    <div class="flex flex-col">
      <span class="text-gray-400 text-sm mb-1">Real Feel</span>
      <span class="text-3xl font-bold text-white">{{ formatFeelsLike() }}&deg;</span>
    </div>
  </div>
  <div class="flex items-start gap-3">
    <i class="bi bi-wind text-gray-400 text-xl mt-1"></i>
    <div class="flex flex-col">
      <span class="text-gray-400 text-sm mb-1">Wind</span>
      <span class="text-3xl font-bold text-white">{{ formatWind() }}</span>
    </div>
  </div>
  <div class="flex items-start gap-3">
    <i class="bi bi-droplet-fill text-gray-400 text-xl mt-1"></i>
    <div class="flex flex-col">
      <span class="text-gray-400 text-sm mb-1">Humidity</span>
      <span class="text-3xl font-bold text-white">{{ weather.humidity }}%</span>
    </div>
  </div>
  <div class="flex items-start gap-3">
    <i class="bi bi-speedometer2 text-gray-400 text-xl mt-1"></i>
    <div class="flex flex-col">
      <span class="text-gray-400 text-sm mb-1">Pressure</span>
      <span class="text-3xl font-bold text-white">{{ formatPressure() }}</span>
    </div>
  </div>
</div>

<div class="fixed bottom-0 left-0 w-full z-50 flex flex-row justify-around items-center bg-[#1b2533]/95 backdrop-blur-md pt-2 pb-[max(0.75rem,env(safe-area-inset-bottom))] px-3 border-t border-gray-700 shadow-2xl lg:static lg:w-20 xl:w-24 lg:flex-col lg:py-8 lg:px-2 lg:gap-6 lg:border-t-0 lg:border lg:rounded-3xl lg:h-fit lg:bg-[#202b3b] shrink-0">
  <!-- Weather Tab -->
  <button
    type="button"
    (click)="selectTab('weather')"
    class="flex flex-col items-center cursor-pointer transition-all rounded-2xl p-2 sm:p-2.5 w-16 sm:w-20 lg:w-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
    [class.text-blue-400]="activeTab === 'weather'"
    [class.bg-blue-500\/10]="activeTab === 'weather'"
    [class.text-gray-400]="activeTab !== 'weather'"
    [class.hover:text-white]="activeTab !== 'weather'"
    [title]="'nav.weather' | translate"
  >
    <i class="bi bi-cloud-sun-fill text-xl sm:text-2xl lg:mb-1"></i>
    <span class="text-[10px] lg:text-xs font-semibold">{{ 'nav.weather' | translate }}</span>
  </button>

  <!-- Cities Tab -->
  <button
    type="button"
    (click)="selectTab('cities')"
    class="flex flex-col items-center cursor-pointer transition-all rounded-2xl p-2 sm:p-2.5 w-16 sm:w-20 lg:w-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
    [class.text-blue-400]="activeTab === 'cities'"
    [class.bg-blue-500\/10]="activeTab === 'cities'"
    [class.text-gray-400]="activeTab !== 'cities'"
    [class.hover:text-white]="activeTab !== 'cities'"
    [title]="'nav.cities' | translate"
  >
    <i class="bi bi-list-ul text-xl sm:text-2xl lg:mb-1"></i>
    <span class="text-[10px] lg:text-xs font-semibold">{{ 'nav.cities' | translate }}</span>
  </button>

  <!-- Settings Tab -->
  <button
    type="button"
    (click)="selectTab('settings')"
    class="flex flex-col items-center cursor-pointer transition-all rounded-2xl p-2 sm:p-2.5 w-16 sm:w-20 lg:w-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
    [class.text-blue-400]="activeTab === 'settings'"
    [class.bg-blue-500\/10]="activeTab === 'settings'"
    [class.text-gray-400]="activeTab !== 'settings'"
    [class.hover:text-white]="activeTab !== 'settings'"
    [title]="'nav.settings' | translate"
  >
    <i class="bi bi-gear-fill text-xl sm:text-2xl lg:mb-1"></i>
    <span class="text-[10px] lg:text-xs font-semibold">{{ 'nav.settings' | translate }}</span>
  </button>

  <!-- PWA Install Button -->
  @if (pwaService.isInstallable() && !pwaService.isInstalled()) {
    <button
      type="button"
      (click)="pwaService.promptInstall()"
      class="flex flex-col items-center cursor-pointer transition-all rounded-2xl p-2 sm:p-2.5 w-16 sm:w-20 lg:w-full text-emerald-400 hover:text-emerald-300 hover:bg-emerald-500/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 lg:mt-auto"
      [title]="'nav.install' | translate"
    >
      <i class="bi bi-download text-xl sm:text-2xl lg:mb-1"></i>
      <span class="text-[10px] lg:text-xs font-semibold">{{ 'nav.install' | translate }}</span>
    </button>
  }

  <!-- Theme Toggle Button -->
  <button
    type="button"
    (click)="toggleTheme()"
    class="flex flex-col items-center cursor-pointer transition-all rounded-2xl p-2 sm:p-2.5 w-16 sm:w-20 lg:w-full text-gray-400 hover:text-amber-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
    [class.lg:mt-auto]="!pwaService.isInstallable() || pwaService.isInstalled()"
    [title]="(settingsService.settings().theme === 'dark' ? 'nav.light' : 'nav.dark') | translate"
  >
    @if (settingsService.settings().theme === 'dark') {
      <i class="bi bi-sun-fill text-xl sm:text-2xl lg:mb-1 text-amber-400"></i>
      <span class="text-[10px] lg:text-xs font-semibold text-amber-400">{{ 'nav.light' | translate }}</span>
    } @else {
      <i class="bi bi-moon-stars-fill text-xl sm:text-2xl lg:mb-1 text-indigo-500"></i>
      <span class="text-[10px] lg:text-xs font-semibold text-indigo-500">{{ 'nav.dark' | translate }}</span>
    }
  </button>
</div>

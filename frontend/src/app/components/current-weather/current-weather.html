<div class="flex justify-between items-center px-4 md:px-6 py-4">
  <div class="flex flex-col">
    <div class="flex items-center gap-3">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-200">{{ weather.cityName }}</h1>
      <button
        type="button"
        (click)="toggleFavorite()"
        [title]="isFavorite ? 'Remove from favorites' : 'Add to favorites'"
        class="p-2 rounded-full hover:bg-white/10 transition-colors cursor-pointer text-2xl flex items-center justify-center"
        [class.text-rose-500]="isFavorite"
        [class.text-gray-400]="!isFavorite"
      >
        <i class="bi" [class.bi-heart-fill]="isFavorite" [class.bi-heart]="!isFavorite"></i>
      </button>
    </div>
    <p class="text-gray-400 text-sm md:text-base capitalize mt-1">{{ weather.description }}</p>
    <div class="text-7xl md:text-8xl font-black text-white mt-4 md:mt-8 tracking-tighter">{{ formatTemp(weather.temperature) }}&deg;</div>
  </div>
  <div class="w-32 h-32 md:w-48 md:h-48 flex items-center justify-center shrink-0">
    <i class="bi {{ iconClass }} {{ colorClass }} text-[100px] md:text-[140px]"></i>
  </div>
</div>

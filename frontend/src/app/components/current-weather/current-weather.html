<div class="flex justify-between items-center px-2 sm:px-4 md:px-6 py-2 sm:py-3">
  <div class="flex flex-col min-w-0 pr-4">
    <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
      <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-gray-100 tracking-tight truncate">{{ weather.cityName }}</h1>
      <button
        type="button"
        (click)="toggleFavorite()"
        [title]="isFavorite ? ('weather.removeFromFavorites' | translate) : ('weather.addToFavorites' | translate)"
        class="p-1 sm:p-1.5 rounded-full hover:bg-white/10 transition-colors cursor-pointer text-xl sm:text-2xl flex items-center justify-center shrink-0"
        [class.text-rose-500]="isFavorite"
        [class.text-gray-400]="!isFavorite"
      >
        <i class="bi" [class.bi-heart-fill]="isFavorite" [class.bi-heart]="!isFavorite"></i>
      </button>

      <!-- Quick Radar Shortcut Button -->
      <button
        type="button"
        (click)="openRadar.emit()"
        [title]="'nav.map' | translate"
        class="px-2.5 py-1 rounded-full bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 border border-blue-500/30 transition-colors cursor-pointer text-xs font-semibold flex items-center gap-1.5 shrink-0"
      >
        <i class="bi bi-radar text-sm"></i>
        <span>{{ 'nav.map' | translate }}</span>
      </button>
    </div>
    <p class="text-gray-400 text-xs sm:text-sm md:text-base capitalize mt-1 truncate">{{ weatherDescription }}</p>
    <div class="text-5xl sm:text-6xl md:text-7xl lg:text-8xl font-black text-white mt-3 sm:mt-6 md:mt-8 tracking-tighter leading-none">
      {{ formatTemp(weather.temperature) }}&deg;
    </div>
  </div>

  <div class="flex items-center justify-center shrink-0">
    <app-weather-icon
      [weatherCode]="weather.weatherCode"
      [isDay]="weather.isDay ?? true"
      [iconCode]="weather.iconCode"
      size="hero"
    ></app-weather-icon>
  </div>
</div>

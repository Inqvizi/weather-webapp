<div class="flex justify-between items-center mb-6">
  <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">{{ 'weather.forecast7d' | translate }}</h3>
</div>

<div class="flex flex-col gap-2">
  @for (day of dailyForecast; track day.rawDateStr; let i = $index) {
    <div
      class="flex items-center justify-between p-3.5 rounded-2xl cursor-pointer hover:bg-white/5 transition-all border border-transparent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
      tabindex="0"
      (click)="onDayClick(day.rawDateStr)"
      (keydown.enter)="onDayClick(day.rawDateStr)"
      (keydown.space)="onDayClick(day.rawDateStr); $event.preventDefault()"
      [class.bg-blue-500\/10]="selectedDate === day.rawDateStr || (!selectedDate && i === 0)"
      [class.border-blue-500\/30]="selectedDate === day.rawDateStr || (!selectedDate && i === 0)"
    >
      <div class="text-gray-400 w-20 font-medium whitespace-nowrap text-sm" [class.text-blue-400]="selectedDate === day.rawDateStr || (!selectedDate && i === 0)">
        {{ formatDayLabel(day.date, day.rawDateStr, i) }}
      </div>

      <div class="flex items-center gap-3 flex-1 px-2 min-w-0">
        <app-weather-icon
          [weatherCode]="day.weatherCode"
          [isDay]="true"
          [iconCode]="day.iconCode"
          size="sm"
        ></app-weather-icon>
        <span class="text-white font-medium text-sm capitalize leading-tight">{{ translateCondition(day.weatherCode, day.description) || 'N/A' }}</span>
      </div>


      <div class="flex items-center justify-end w-20 shrink-0">
        <span class="text-white font-bold">{{ formatTemp(day.maxTemp) }}&deg;</span>
        <span class="text-gray-500 mx-1">/</span>
        <span class="text-gray-400 text-sm">{{ formatTemp(day.minTemp) }}&deg;</span>
      </div>
    </div>
  }
</div>
